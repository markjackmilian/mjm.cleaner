name: Build macOS release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag esistente da pubblicare, per esempio v0.0.1"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test --configuration Release

      - name: Test bundle configuration
        run: bash tests/build/bundle-config.test.sh

  package:
    name: Package ${{ matrix.architecture }}
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            architecture: arm64
          - runtime: osx-x64
            architecture: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build application bundle
        env:
          RELEASE_VERSION: ${{ env.RELEASE_TAG }}
          BUILD_NUMBER: ${{ github.run_number }}
          RUNTIME_ID: ${{ matrix.runtime }}
        run: |
          ./build/bundle.sh \
            --runtime "$RUNTIME_ID" \
            --version "$RELEASE_VERSION" \
            --build-number "$BUILD_NUMBER"

      - name: Upload application archive
        uses: actions/upload-artifact@v4
        with:
          name: mjm.cleaner-${{ env.RELEASE_TAG }}-macos-${{ matrix.architecture }}
          path: artifacts/*.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download application archives
        uses: actions/download-artifact@v4
        with:
          pattern: mjm.cleaner-*-macos-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
